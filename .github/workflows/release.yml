name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify version match
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MODULE_VERSION=$(grep '"version"' module.json | head -1 | sed 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/')
          if [ "$TAG_VERSION" != "$MODULE_VERSION" ]; then
            echo "ERROR: Tag ($TAG_VERSION) != module.json ($MODULE_VERSION)"; exit 1
          fi
          echo "Version check passed: $TAG_VERSION"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build with Docker
        run: |
          docker build -t mist-builder -f scripts/Dockerfile .
          docker run --rm -v "$PWD:/build" -w /build mist-builder ./scripts/build.sh
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/mist-module.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
